<html>
<head>
<style>
textarea{
width: 100%;
padding: 12px 20px;
box-sizing: border-box;
border: 2px solid #ccc;
border-radius: 4px;
background-color: #f8f8f8;
font size: 16px;
resize: none;
}
</style>
</head>
<body>
<h2>Dar estilo al area de texto</h2>
<p><strong>Consejo:</strong>Utilice la propiedad de cambio de tamaño para evitar que las areas de texto se redimensionen(deshabiliten el "agarrador" en la esquina inferior derecha):</p>
<form>
<textarea>Un poco de texto...</textarea>
</form>
</body>
</html>
